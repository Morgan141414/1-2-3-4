<div class="flex text-gray-500 mb-4">
  @for (tab of tabs(); track tab.id) {
    <div (click)="changed.emit(tab.id)"
         [ngClass]="{ 'text-blue-600 border-blue-600' : activeTab() === tab.id }"
         class="pb-3 px-6 font-medium capitalize cursor-pointer border-b-2 hover:border-blue-400 hover:text-blue-400">
      {{ tab.title }}
    </div>
  }
  <div class="pb-3 border-b-2 flex-auto"></div>
</div>
