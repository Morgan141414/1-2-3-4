<div class="w-full h-dvh flex">
  @if (isAuthenticated()) {
    <app-nav />
  }
  <div class="w-full flex flex-col">
    @if (isAuthenticated()) {
      <app-header />
    }
    <main class="flex-auto relative m-4 overflow-hidden">
      <div class="absolute top-0 bottom-0 left-0 border rounded-md p-4 overflow-auto"
           [@contentResize]="panel() ? 'panelOpened' : 'panelClosed'">
        <router-outlet></router-outlet>
      </div>

      @if (isAuthenticated()) {
        <app-main-nav-flying class="absolute top-0 bottom-0 right-0 w-1/3 min-w-96 border rounded-md p-4 overflow-auto bg-white"
                             [@slideInOut]="panel() ? 'opened' : 'closed'" />
      }
    </main>
  </div>
</div>
