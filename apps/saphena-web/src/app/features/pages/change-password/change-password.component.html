<form [formGroup]="form"
      (ngSubmit)="onSubmit()">
  <div class="flex flex-col gap-4 w-fit">
    <app-input-field label="Старый пароль"
                     [controlName]="form.controls.oldPassword"
                     placeholder="Введите старый пароль" />

    <app-input-field label="Новый пароль"
                     [controlName]="form.controls.newPassword"
                     placeholder="Введите новый пароль" />

    <app-input-field label="Новый пароль"
                     [controlName]="form.controls.confirmNewPassword"
                     placeholder="Повторите новый пароль" />

    <button [disabled]="form.disabled"
            class="bg-blue-600 p-2 text-white rounded-md disabled:opacity-60">
      Изменить
    </button>
  </div>
</form>
