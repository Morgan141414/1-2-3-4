<div class="flex justify-end mb-6">
  <button (click)="openAddDocumentPanel()"
          class="text-sm font-medium text-white bg-blue-500 px-4 py-2 rounded-md hover:bg-blue-400 active:scale-95">
    Добавить документ
  </button>
</div>

<table class="w-full">
  <thead class="border-b uppercase text-sm text-gray-500">
  <td class="px-2 pb-2">Название</td>
  <td class="px-2 pb-2"></td>
  </thead>
  <tbody>
    @for (orgDoc of organizationDocuments(); track orgDoc.id) {
      <tr class="border-b"
          [ngClass]="{ 'bg-gray-50' : orgDoc.deleted}">
        <td class="px-2 py-2"
            [ngClass]="{ 'text-gray-500' : orgDoc.deleted}">
          {{ orgDoc.name }}
        </td>
        <td class="px-2 py-2 flex gap-4">
          @if (orgDoc.deleted) {
            <button class="hover:text-green-500 active:scale-95"
                    (click)="openRestoreDialog(orgDoc)">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          } @else {
            <button [matMenuTriggerFor]="menu"
                    class="w-4 hover:text-blue-500 active:scale-95">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item
                      (click)="openProtocolDialog(orgDoc)">
                <i class="fa-solid fa-file-medical mr-1 text-blue-500"></i>
                Протокол
              </button>
              <button mat-menu-item
                      (click)="openEditPanel(orgDoc.id)">
                <i class="fa-solid fa-pencil mr-1 text-yellow-500"></i>
                Редактировать
              </button>
              <button mat-menu-item
                      (click)="openDeleteDialog(orgDoc)">
                <i class="fa-solid fa-trash mr-1 text-rose-600"></i>
                Удалить
              </button>
            </mat-menu>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
