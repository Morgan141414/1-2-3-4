<div class="flex justify-end mb-6">
  <button (click)="openAddOrganizationPanel()"
          class="text-sm font-medium text-white bg-blue-500 px-4 py-2 rounded-md hover:bg-blue-400 active:scale-95">
    Добавить больницу
  </button>
</div>

<app-organization-table />

@if (organizations() && organizations().totalPages > 1) {
  <app-pagination [totalPages]="organizations()!.totalPages"
                  [number]="organizations()!.number"
                  [last]="organizations()!.last"
                  (pageChanged)="getOrganizations($event)" />
}
