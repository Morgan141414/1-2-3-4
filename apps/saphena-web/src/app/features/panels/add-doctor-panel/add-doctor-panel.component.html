<app-iin-input-field [controlName]="iin"
                     (filled)="onIinFilled()" />

@if (doctor()) {
  <div class="flex flex-col gap-4">
    <div class="mt-4 text-gray-500 uppercase text-sm">
      Личная информация
    </div>
    <div>
      <div class="font-medium capitalize ml-1">Фамилия</div>
      <div>{{ doctor()?.lastName }}</div>
    </div>
    <div>
      <div class="font-medium capitalize ml-1">Имя</div>
      <div>{{ doctor()?.firstName }}</div>
    </div>
    <div>
      <div class="font-medium capitalize ml-1">Отчество / Второе имя</div>
      <div>{{ doctor()?.middleName }}</div>
    </div>
    <div>
      <div class="font-medium capitalize ml-1">Телефон</div>
      @if(doctor()?.phone) {
        <div>+{{ doctor()!.phone! | mask: "0 (000) 000 00 00" }}</div>
      }
    </div>
    <div>
      <div class="font-medium capitalize ml-1">Email</div>
      <div>{{ doctor()?.email }}</div>
    </div>
  </div>

  <button (click)="addDoctor()"
          [disabled]="iin.disabled"
          class="mt-4 bg-blue-600 py-2 px-4 text-white rounded-md">
    Добавить
  </button>
}
