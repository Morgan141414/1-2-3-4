@if (!isFormVisible()) {
  <div class="flex justify-between">
    <div class="flex gap-6">
      <select [(ngModel)]="selectedSchedule"
              (change)="updateEvents()"
              class="min-w-48 py-1 px-2 border rounded-md outline-none cursor-pointer focus:border-blue-400">
        <option [value]="null" disabled></option>
        @for (s of schedules(); track s.id) {
          <option [ngValue]="s">
            {{ s.name + ' (' + (s.startDate | date : 'dd.MM.yyyy') + ' - ' + ((s.endDate | date : 'dd.MM.yyyy') || 'не указано') + ')' }}
          </option>
        }
      </select>

      @if (selectedSchedule()) {
        <button (click)="editWorkSchedule()"
                class="text-sm font-medium text-white bg-yellow-500 hover:bg-yellow-600 px-4 py-2 rounded-md active:scale-95">
          Изменить
        </button>
        <button (click)="deleteWorkSchedule()"
                class="text-sm font-medium text-white bg-red-500 hover:bg-red-600 px-4 py-2 rounded-md active:scale-95">
          Удалить
        </button>
      }
    </div>

    <button (click)="showForm()"
            class="text-sm font-medium text-white bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded-md active:scale-95">
      Добавить
    </button>
  </div>
} @else {
  <div class="flex gap-8 justify-between items-start">
    <div class="flex flex-wrap gap-4">
      <app-input-field [controlName]="form.controls.name"
                       label="Название" />

      <app-date-input-field [controlName]="form.controls.startDate"
                            label="Начало" />

      <app-date-input-field [controlName]="form.controls.endDate"
                            label="Конец" />
    </div>

    <div class="flex gap-4">
      @if (isEdit()) {
        <button (click)="updateSchedule()"
                class="text-sm font-medium text-white bg-green-500 hover:bg-green-600 px-4 py-2 rounded-md active:scale-95">
          Сохранить
        </button>
      } @else {
        <button (click)="createSchedule()"
                class="text-sm font-medium text-white bg-green-500 hover:bg-green-600 px-4 py-2 rounded-md active:scale-95">
          Сохранить
        </button>
      }

      <button (click)="cancel()"
              class="text-sm font-medium text-white bg-gray-500 px-4 py-2 rounded-md hover:bg-gray-600 active:scale-95">
        Отменить
      </button>
    </div>
  </div>
}

<div class="mt-8">
  <mwl-calendar-week-view [viewDate]="date"
                          [weekStartsOn]="DAYS_OF_WEEK.MONDAY"
                          [dayStartHour]="8"
                          [dayEndHour]="20"
                          [hourSegments]="2"
                          [headerTemplate]="customHeaderTemplate"
                          [events]="events()"
                          (hourSegmentClicked)="onHourSegmentClicked($event.date)"
                          (eventTimesChanged)="eventTimesChanged($event)"
                          locale="ru-KZ" />
</div>

<ng-template #customHeaderTemplate let-days="days">
  <div class="cal-day-headers">
    @for (day of days; track day) {
      <div class="cal-header font-medium capitalize">
        {{ day.date | date: 'EEEE' : '' : 'ru-KZ' }}
      </div>
    }
  </div>
</ng-template>
