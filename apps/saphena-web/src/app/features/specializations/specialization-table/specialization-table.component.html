<table class="w-full">
  <thead class="border-b uppercase text-sm text-gray-500">
    <td class="px-2 pb-2">Название</td>
    <td class="px-2 pb-2"></td>
  </thead>
  <tbody>
    @for (spec of specializations(); track spec.id) {
      <tr class="border-b hover:bg-gray-100 focus:bg-blue-100"
          [ngClass]="{ 'bg-gray-50' : spec.deleted}">
        <td class="px-2 py-2 cursor-pointer"
            [ngClass]="{ 'text-gray-500 pointer-events-none' : spec.deleted}"
            (click)="goToProcedureListPage(spec.id)">
          {{ spec.name }}
        </td>
        <td class="px-2 py-2 text-center">
          @if (spec.deleted) {
            <button class="hover:text-green-500 active:scale-95"
                    (click)="openRestoreDialog(spec)">
              <i class="fa-solid fa-rotate-left"></i>
            </button>
          } @else {
            <button [matMenuTriggerFor]="menu"
                    class="w-4 hover:text-blue-500 active:scale-95">
              <i class="fa-solid fa-ellipsis-vertical"></i>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item
                      (click)="openEditSpecializationPanel(spec.id)">
                <i class="fa-solid fa-pen mr-1 text-yellow-500"></i>
                Редактировать
              </button>
              <button mat-menu-item
                      (click)="openDeleteDialog(spec)">
                <i class="fa-solid fa-trash mr-1 text-rose-600"></i>
                Удалить
              </button>
            </mat-menu>
          }
        </td>
      </tr>
    }
  </tbody>
</table>
