<div class="flex gap-4 pb-4 mb-6 border-b">
  <div>
    <div class="font-medium text-gray-600">
      Специализация
    </div>
    <select [(ngModel)]="selectedSpecializationId"
            (change)="onSpecializationChange()"
            class="min-w-60 py-1 px-2 border rounded-md outline-none cursor-pointer focus:border-blue-400">
      @for (specialization of specializations(); track specialization.id) {
        <option [value]="specialization.id">
          {{ specialization.name }}
        </option>
      }
    </select>
  </div>

  <div>
    <div class="font-medium text-gray-600">
      Доктор
    </div>
    <select [(ngModel)]="selectedDoctorSpecialization"
            [disabled]="!selectedSpecializationId()"
            (change)="onDoctorChange()"
            class="min-w-80 py-1 px-2 border rounded-md outline-none enabled:cursor-pointer focus:border-blue-400">
      <option [value]="null"
              disabled></option>
      @for (ds of doctorSpecializations(); track ds.id) {
        <option [ngValue]="ds">
          {{ getFullname(ds.doctor!.firstName, ds.doctor!.lastName, ds.doctor!.middleName) }}
        </option>
      }
    </select>
  </div>
</div>
