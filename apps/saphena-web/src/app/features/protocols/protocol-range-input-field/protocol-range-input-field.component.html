<div class="saphena-input-field mb-6 grid grid-cols-[300px_1fr] gap-x-20">
  <div>
    @if (field().title.trim()) {
      {{ field().title }}:
    }
  </div>

  <div class="flex gap-4 flex-wrap">
    <div class="text-nowrap">
      от
      <input type="number"
             [formControl]="control().controls.from"
             class="w-24 border py-1 px-2 rounded-md focus:outline-blue-400">
      {{ field().unit }}
    </div>
    <div class="text-nowrap">
      до
      <input type="number"
             [formControl]="control().controls.to"
             class="w-24 border py-1 px-2 rounded-md focus:outline-blue-400">
      {{ field().unit }}
    </div>
  </div>
</div>
