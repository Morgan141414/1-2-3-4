services:
  postgres:
    image: postgres:16.8-alpine
    container_name: saphena-postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Almaty}
      PGTZ: ${TZ:-Asia/Almaty}
      POSTGRES_DB: ${POSTGRES_DB:-saphena_api}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-saphena_api}"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: saphena-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-notification}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  saphena-api:
    build:
      context: ./services/saphena-api
      dockerfile: Dockerfile
    container_name: saphena-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      whatsapp-bot:
        condition: service_started
    environment:
      API_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-saphena_api}
      API_DB_USERNAME: ${POSTGRES_USER:-postgres}
      API_DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      API_JWT_SECRET: ${API_JWT_SECRET:-change-me-base64-secret}
      NOTIFICATION_SERVICE_URL: http://whatsapp-bot:3000
      NOTIFICATION_SERVICE_ENABLED: ${NOTIFICATION_SERVICE_ENABLED:-true}
    ports:
      - "8080:8080"

  saphena-notification-api:
    build:
      context: ./services/saphena-notification-api
      dockerfile: Dockerfile
    container_name: saphena-notification-api
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_started
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_MONGODB_URI: mongodb://${MONGO_INITDB_ROOT_USERNAME:-admin}:${MONGO_INITDB_ROOT_PASSWORD:-change-me}@mongodb:27017/${MONGO_INITDB_DATABASE:-notification}?authSource=admin
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-change-me}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-change-me}
      TWILIO_WHATSAPP_FROM_NUMBER: ${TWILIO_WHATSAPP_FROM_NUMBER:-change-me}
    ports:
      - "8081:8081"

  saphena-web:
    build:
      context: ./apps/saphena-web
      dockerfile: Dockerfile
    container_name: saphena-web
    restart: unless-stopped
    depends_on:
      saphena-api:
        condition: service_started
    ports:
      - "4200:80"

  whatsapp-bot:
    build:
      context: ./services/whatsapp-bot
      dockerfile: Dockerfile
    container_name: whatsapp-bot
    restart: unless-stopped
    environment:
      PORT: 3000
    ports:
      - "3000:3000"
    volumes:
      - wwebjs_auth:/app/.wwebjs_auth

volumes:
  postgres_data:
  mongodb_data:
  wwebjs_auth:
