spring.application.name=saphena
server.port=8080

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${API_DB_URL:jdbc:postgresql://localhost:5432/saphena_api}
spring.datasource.username=${API_DB_USERNAME:postgres}
spring.datasource.password=${API_DB_PASSWORD:change-me}

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.hibernate.ddl-auto=none

spring.flyway.enabled=true

logging.level.root=warn
logging.level.kz.saphena.api=info
logging.level.org.springframework=error
logging.file.name=/app/logs/application.log

# This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line, to generate a 512 bits one `openssl rand -base64 128`)
security.jwt_secret=${API_JWT_SECRET:change-me-base64-secret}
security.jwt_expiration_hr=${API_JWT_EXPIRATION_HR:10}

spring.servlet.multipart.max-file-size=${API_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${API_MAX_REQUEST_SIZE:10MB}

# Notification service configuration
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:3000}
notification.service.enabled=${NOTIFICATION_SERVICE_ENABLED:true}
notification.send.delay-ms=${NOTIFICATION_SEND_DELAY_MS:1000}
notification.retry.max-attempts=${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
notification.retry.delay-ms=${NOTIFICATION_RETRY_DELAY_MS:5000}
notification.check.interval-ms=${NOTIFICATION_CHECK_INTERVAL_MS:60000}

# Revenue split configuration (default ratios for staff and clinic owned clients)
revenue.split.doctor-client-ratio=${REVENUE_SPLIT_DOCTOR_CLIENT_RATIO:0.5}
revenue.split.clinic-client-ratio=${REVENUE_SPLIT_CLINIC_CLIENT_RATIO:0.25}

# Sms provider configuration
sms.mobizon.host=${MOBIZON_HOST:api.mobizon.kz}
sms.mobizon.api-key=${MOBIZON_API_KEY:change-me}
