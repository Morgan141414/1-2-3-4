services:
  api-db:
    container_name: saphena-api-db
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      TZ: 'Asia/Almaty'
      PGTZ: 'Asia/Almaty'
      POSTGRES_DB: saphena_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./data/api_db:/var/lib/postgresql/data
    networks:
      - saphena-nw

networks:
  saphena-nw:
    driver: bridge
